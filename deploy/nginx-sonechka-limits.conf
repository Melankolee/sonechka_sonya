# Копия /etc/nginx/conf.d/sonechka-limits.conf.
#
# limit_req_zone можно объявлять только в http{}, а править общий nginx.conf на
# этом сервере не хочется — рядом чужой прод. Отдельный файл в conf.d/ попадает
# в http{} через уже существующий include и ничего чужого не задевает.
#
# 10 запросов в минуту на IP: гость нажимает «Я приду» один раз, а страница
# /sonechka только читает — обычной жизни лимит не мешает.
limit_req_zone $binary_remote_addr zone=sonechka_api:1m rate=10r/m;

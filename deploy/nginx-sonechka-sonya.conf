
server {
    server_name sonechka-sonya.ru www.sonechka-sonya.ru;

    root /var/www/sonechka-sonya.ru;
    index index.html;

    # gzip_types в nginx.conf закомментирован, поэтому глобально жмётся только
    # text/html. Здесь добавляем CSS и JS (~270 КБ несжатыми). woff2 не трогаем —
    # они уже сжаты внутри формата.
    gzip_types text/css application/javascript text/javascript image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }

    # Имена файлов шрифтов захешированы Google, версии React зафиксированы —
    # можно кэшировать надолго.
    location ~* ^/(fonts|vendor)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # HTML не кэшируем, чтобы правки контента долетали сразу.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sonechka-sonya.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sonechka-sonya.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.sonechka-sonya.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = sonechka-sonya.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name sonechka-sonya.ru www.sonechka-sonya.ru;
    return 404; # managed by Certbot




}
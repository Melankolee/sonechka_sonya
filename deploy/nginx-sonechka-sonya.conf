
# Зона для limit_req живёт в http{}, а этот файл — server{}. Чтобы не лезть в
# общий nginx.conf (рядом чужой прод), кладём её отдельным файлом:
#   /etc/nginx/conf.d/sonechka-limits.conf
#   limit_req_zone $binary_remote_addr zone=sonechka_api:1m rate=10r/m;
server {
    server_name sonechka-sonya.ru www.sonechka-sonya.ru;

    root /var/www/sonechka-sonya.ru;
    index index.html;

    # gzip_types в nginx.conf закомментирован, поэтому глобально жмётся только
    # text/html. Здесь добавляем CSS и JS (~270 КБ несжатыми). woff2 не трогаем —
    # они уже сжаты внутри формата.
    gzip_types text/css application/javascript text/javascript image/svg+xml;
    gzip_min_length 1024;

    # $uri.html — чтобы персональные страницы открывались как /nastia,
    # а не только /nastia.html (сами файлы — ссылки на index.html).
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Ответы гостей: сервис sonechka-answers на 127.0.0.1:8787
    # (deploy/answers-api.py, ставится через deploy/answers-setup.sh).
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        # Ручка открыта без ключа — придерживаем поток запросов, чтобы файл
        # ответов нельзя было забить в один присест.
        limit_req zone=sonechka_api burst=10 nodelay;
        client_max_body_size 8k;
        access_log off;
    }

    # Имена файлов шрифтов захешированы Google, версии React зафиксированы —
    # можно кэшировать надолго.
    location ~* ^/(fonts|vendor)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # HTML не кэшируем, чтобы правки контента долетали сразу. Регуляркой, а не
    # `location = /index.html`: страниц теперь несколько (/sonechka), а после
    # try_files $uri.html запрос доходит сюда уже как /sonechka.html.
    location ~ \.html$ {
        add_header Cache-Control "no-cache";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sonechka-sonya.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sonechka-sonya.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.sonechka-sonya.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = sonechka-sonya.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name sonechka-sonya.ru www.sonechka-sonya.ru;
    return 404; # managed by Certbot




}
# nginx внутри контейнера (Dockerfile). TLS — на внешнем reverse proxy,
# контейнер слушает только HTTP. Логика та же, что в caddy-travel.caddy.

map $uri $travel_cache {
    default                  "no-cache";
    ~^/assets/               "public, max-age=31536000, immutable";
    ~^/(icons|pdfjs)/        "public, max-age=86400";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
        text/javascript           mjs;
        application/wasm          wasm;
    }

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    # Внешний HTTPS-прокси ставит basic auth, если нужен; здесь — только
    # заголовки. add_header на уровне server, чтобы location их не сбрасывали.
    add_header Cache-Control $travel_cache always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    # Маршруты на хэше, SPA-фолбэк не нужен: отсутствующий файл — честный 404,
    # чтобы Service Worker не закешировал index.html под видом скрипта.
    location / {
        try_files $uri $uri/ =404;
    }
}

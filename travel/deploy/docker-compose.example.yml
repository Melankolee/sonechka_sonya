# Пример сервиса для хоста с Docker. Запуск из travel/:
#   docker compose -f deploy/docker-compose.example.yml up -d --build
#
# Наружу — только на localhost, HTTPS и сертификаты остаются у внешнего прокси.
# Для Caddy:
#   travel.sonechka-sonya.ru {
#       reverse_proxy 127.0.0.1:8788
#   }
services:
  travel:
    build:
      context: ..
    image: travel:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8788:80"
    volumes:
      # Поездки с документами — с диска хоста, не из образа.
      - ../trips:/usr/share/nginx/html/trips:ro

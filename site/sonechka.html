<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ответы гостей — Софья</title>
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="./img/favicon-32.png">
<link rel="apple-touch-icon" href="./img/apple-touch-icon.png">
<link href="./fonts/fonts.css" rel="stylesheet">
<style>
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: #EFE9DE; color: #453C33; }
  * { box-sizing: border-box; }
  a { color: #8A382F; text-decoration: none; border-bottom: 1px solid rgba(138,56,47,.35); }
  .wrap { min-height: 100vh; display: flex; justify-content: center; padding: 0 0 80px; }
  .sheet { width: 100%; max-width: 620px; background: linear-gradient(180deg, #F5F1E9 0%, #EFE9DE 38%, #EDE6DA 100%); box-shadow: 0 0 80px rgba(93,74,58,.09); padding: 0 22px; }
  .head { padding: 72px 8px 0; text-align: center; }
  .kicker { font-family: 'Manrope', sans-serif; font-size: 10px; letter-spacing: .36em; text-transform: uppercase; color: rgba(138,56,47,.75); }
  h1 { margin: 18px 0 0; font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: clamp(32px, 8.4vw, 46px); line-height: 1.1; color: #3E342C; }
  h1 em { font-style: italic; color: #8A382F; }
  .sub { margin: 14px 0 0; font-family: 'Manrope', sans-serif; font-weight: 300; font-size: 13px; line-height: 1.7; color: #6A5C4F; }
  .rule { width: 1px; height: 46px; margin: 30px auto 26px; background: linear-gradient(180deg, rgba(138,56,47,.5), rgba(138,56,47,0)); }
  .card { margin-top: 14px; padding: 26px 24px 28px; background: rgba(255,253,248,.72); border: 1px solid rgba(138,56,47,.16); border-radius: 3px; }
  .card.muted { background: transparent; border-style: dashed; border-color: rgba(138,56,47,.2); }
  .card-top { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; }
  .guest { margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: 27px; color: #3E342C; }
  .when { font-family: 'Manrope', sans-serif; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: rgba(69,60,51,.45); text-align: right; white-space: nowrap; }
  .rows { margin-top: 16px; display: grid; gap: 12px; }
  .row { display: flex; align-items: baseline; gap: 14px; padding-bottom: 11px; border-bottom: 1px solid rgba(138,56,47,.14); }
  .row:last-child { border-bottom: none; padding-bottom: 0; }
  .label { flex: none; width: 92px; font-family: 'Manrope', sans-serif; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: rgba(69,60,51,.5); }
  .value { flex: 1; font-family: 'Cormorant Garamond', serif; font-size: 20px; line-height: 1.4; color: #3E342C; }
  .value.empty { font-style: italic; color: rgba(69,60,51,.4); }
  .note { margin: 14px 0 0; font-family: 'Manrope', sans-serif; font-weight: 300; font-size: 12px; color: rgba(69,60,51,.5); }
  /* Мысли с листков блокнота: бумага в линейку, как на самой странице приглашения. */
  .ideas { margin-top: 18px; }
  .idea { margin-top: 10px; padding: 12px 14px; border-radius: 2px; background: #FFFDF8; border: 1px solid rgba(138,56,47,.14); border-left: 2px solid rgba(169,88,74,.4); }
  .idea p { margin: 0; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 19px; line-height: 1.45; color: #3E342C; white-space: pre-wrap; }
  .idea .when { display: block; margin-top: 6px; text-align: left; }
  .waiting { margin: 0; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 21px; color: rgba(69,60,51,.45); }
  .tally { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding-bottom: 11px; border-bottom: 1px solid rgba(138,56,47,.14); font-family: 'Cormorant Garamond', serif; font-size: 20px; color: #3E342C; }
  .tally:last-child { border-bottom: none; padding-bottom: 0; }
  .count { font-family: 'Manrope', sans-serif; font-size: 12px; letter-spacing: .1em; color: #8A382F; white-space: nowrap; }
  .foot { margin-top: 30px; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 12px 16px; }
  button { font: inherit; color: inherit; padding: 13px 26px; border-radius: 999px; background: transparent; border: 1px solid rgba(138,56,47,.35); font-family: 'Manrope', sans-serif; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #8A382F; cursor: pointer; transition: background .25s, color .25s, opacity .25s; }
  button:hover:not(:disabled) { background: #8A382F; border-color: #8A382F; color: #FBF8F2; }
  button:disabled { opacity: .35; cursor: default; }
  /* Очистка — не то, что нажимают часто: тише рамка, никакой заливки до наведения. */
  .danger { border-color: rgba(69,60,51,.22); color: rgba(69,60,51,.55); }
  .danger:hover:not(:disabled) { background: transparent; border-color: #8A382F; color: #8A382F; }
  /* Статус — на своей строке, чтобы длинная ошибка не растаскивала кнопки. */
  .status { flex-basis: 100%; text-align: center; font-family: 'Manrope', sans-serif; font-weight: 300; font-size: 12px; color: rgba(69,60,51,.5); }
  .error { color: #8A382F; }
</style>
</head>
<body>
<div class="wrap">
  <div class="sheet">
    <div class="head">
      <div class="kicker">только для Сони</div>
      <h1>Кто что<br><em>выбрал</em></h1>
      <p class="sub" id="sub">Загружаю ответы…</p>
    </div>
    <div class="rule"></div>
    <div id="guests"></div>
    <div id="summary"></div>
    <div class="foot">
      <button type="button" id="refresh">Обновить</button>
      <button type="button" id="clear" class="danger" disabled>Очистить</button>
      <span class="status" id="status"></span>
    </div>
  </div>
</div>

<script>
// Список тот же, что в index.html (поле guests компонента): по нему видно не
// только пришедшие ответы, но и от кого ещё ждём.
// rows — какие вопросы задавали этому гостю: у Кости (site/kostya.html) своя
// страница про пиво, матрёшки и фильмы он не выбирал, и пустых строк «не
// выбрал» на его карточке быть не должно.
var ROWS_DEFAULT = [
  { label: 'Матрёшка', field: 'doll' },
  { label: 'Смотрим',  field: 'watch' },
  { label: 'Пьём',     field: 'drink' }
];

var GUESTS = [
  { key: 'nastia', name: 'Настя' },
  { key: 'uliya',  name: 'Уля' },
  { key: 'ksusha', name: 'Ксюша' },
  { key: 'kostya', name: 'Костя', empty: 'не выбрал', sentVerb: 'отправлял', rows: [
    { label: 'Куда', field: 'place' },
    { label: 'Пьём', field: 'drink' }
  ] }
];

function guestConf(key) {
  return GUESTS.filter(function (g) { return g.key === key; })[0] || null;
}

var el = function (tag, cls, text) {
  var node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text; // только textContent: ответы приходят снаружи
  return node;
};

function fmtTime(iso) {
  var d = new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleString('ru-RU', {
    timeZone: 'Europe/Moscow', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit'
  });
}

function plural(n, one, few, many) {
  var mod10 = n % 10, mod100 = n % 100;
  if (mod10 === 1 && mod100 !== 11) return one;
  if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return few;
  return many;
}

function entryKey(a) {
  return a.guest || 'other:' + (a.name || '');
}

// Мысль с листка блокнота приезжает своей записью — у неё непустое idea и нет
// ни матрёшки, ни напитков. Такие записи не должны подменять собой ответ.
function isIdea(a) {
  return !!(a && a.idea);
}

function ideasByGuest(answers) {
  var byKey = {};
  answers.forEach(function (a) {
    var key = entryKey(a);
    (byKey[key] = byKey[key] || []).push(a);
  });
  Object.keys(byKey).forEach(function (k) {
    byKey[k].sort(function (a, b) { return String(a.ts) < String(b.ts) ? -1 : 1; });
  });
  return byKey;
}

// Ответы хранятся append-only: гость мог нажать «Я приду» несколько раз.
// Показываем последний, число попыток оставляем подписью.
function latestByGuest(answers) {
  var byKey = {};
  answers.forEach(function (a) {
    var key = entryKey(a);
    var prev = byKey[key];
    if (!prev) byKey[key] = { last: a, count: 1 };
    else {
      prev.count += 1;
      if (String(a.ts) >= String(prev.last.ts)) prev.last = a; // ISO-время сравнимо как строка
    }
  });
  return byKey;
}

function guestTitle(key, answer) {
  var known = guestConf(key);
  if (known) return known.name;
  if (answer && answer.name) return answer.name;
  return 'Гость без имени';
}

// Какие строки показывать в карточке. У знакомого гостя — его набор вопросов,
// у незнакомого адреса — стандартный плюс «Куда», если он что-то там выбрал.
function rowsFor(key, answer) {
  var known = guestConf(key);
  if (known && known.rows) return known.rows;
  var place = answer && answer.place;
  return place && place.length
    ? ROWS_DEFAULT.concat([{ label: 'Куда', field: 'place' }])
    : ROWS_DEFAULT;
}

function renderRow(label, value, emptyText) {
  var row = el('div', 'row');
  row.appendChild(el('span', 'label', label));
  var filled = Array.isArray(value) ? value.length > 0 : !!value;
  row.appendChild(el('span', 'value' + (filled ? '' : ' empty'),
    filled ? (Array.isArray(value) ? value.join(', ') : value) : (emptyText || 'не выбрала')));
  return row;
}

function renderIdeas(list) {
  var box = el('div', 'ideas');
  box.appendChild(el('div', 'label', plural(list.length, 'Мысль', 'Мысли', 'Мысли')));
  list.forEach(function (a) {
    var item = el('div', 'idea');
    item.appendChild(el('p', null, a.idea));
    item.appendChild(el('span', 'when', fmtTime(a.ts)));
    box.appendChild(item);
  });
  return box;
}

function renderGuests(byKey, ideasKey) {
  var box = document.getElementById('guests');
  box.textContent = '';
  var seen = {};
  var order = GUESTS.map(function (g) { return g.key; });
  // Сначала знакомые гости — в порядке списка, потом ответы с чужих адресов.
  Object.keys(byKey).forEach(function (k) { if (order.indexOf(k) === -1) order.push(k); });
  Object.keys(ideasKey).forEach(function (k) { if (order.indexOf(k) === -1) order.push(k); });

  order.forEach(function (key) {
    if (seen[key]) return;
    seen[key] = true;
    var entry = byKey[key];
    var ideas = ideasKey[key] || [];
    var card = el('div', 'card' + (entry || ideas.length ? '' : ' muted'));
    var top = el('div', 'card-top');
    top.appendChild(el('h2', 'guest', guestTitle(key, (entry && entry.last) || ideas[0])));
    if (entry) top.appendChild(el('span', 'when', fmtTime(entry.last.ts)));
    card.appendChild(top);

    if (!entry) {
      card.appendChild(el('p', 'waiting', 'ответа пока нет'));
    } else {
      var conf = guestConf(key);
      var rows = el('div', 'rows');
      rowsFor(key, entry.last).forEach(function (r) {
        rows.appendChild(renderRow(r.label, entry.last[r.field], conf && conf.empty));
      });
      card.appendChild(rows);
      if (entry.count > 1) {
        card.appendChild(el('p', 'note', ((conf && conf.sentVerb) || 'отправляла') + ' ' +
          entry.count + ' ' + plural(entry.count, 'раз', 'раза', 'раз') + ', показан последний ответ'));
      }
    }
    if (ideas.length) card.appendChild(renderIdeas(ideas));
    box.appendChild(card);
  });
}

function tally(entries, field) {
  var counts = {};
  entries.forEach(function (e) {
    var value = e.last[field];
    var list = Array.isArray(value) ? value : (value ? [value] : []);
    list.forEach(function (v) { counts[v] = (counts[v] || 0) + 1; });
  });
  return Object.keys(counts)
    .map(function (title) { return { title: title, count: counts[title] }; })
    .sort(function (a, b) { return b.count - a.count || a.title.localeCompare(b.title, 'ru'); });
}

function renderSummary(byKey) {
  var box = document.getElementById('summary');
  box.textContent = '';
  var entries = Object.keys(byKey).map(function (k) { return byKey[k]; });
  if (!entries.length) return;

  var card = el('div', 'card');
  card.appendChild(el('h2', 'guest', 'Итого'));
  [
    { label: 'Матрёшки', field: 'doll' },
    { label: 'Фильмы', field: 'watch' },
    { label: 'Куда идём', field: 'place' },
    { label: 'Напитки', field: 'drink' }
  ].forEach(function (group) {
    var lines = tally(entries, group.field);
    if (!lines.length) return;
    var rows = el('div', 'rows');
    rows.style.marginTop = '20px';
    rows.appendChild(el('div', 'label', group.label));
    lines.forEach(function (line) {
      var row = el('div', 'tally');
      row.appendChild(el('span', null, line.title));
      row.appendChild(el('span', 'count', '×' + line.count));
      rows.appendChild(row);
    });
    card.appendChild(rows);
  });
  box.appendChild(card);
}

var status = document.getElementById('status');
var clearBtn = document.getElementById('clear');
var total = 0; // строк в хранилище, не гостей: очищаем именно строки

function now() {
  return new Date().toLocaleTimeString('ru-RU',
    { timeZone: 'Europe/Moscow', hour: '2-digit', minute: '2-digit' });
}

// Возвращает промис: очистка дописывает свой статус уже после перерисовки,
// иначе «обновлено в …» затирает «очищено в …».
function load() {
  status.className = 'status';
  status.textContent = 'обновляю…';
  return fetch('/api/answers', { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (data) {
      var all = (data && data.answers) || [];
      total = all.length;
      clearBtn.disabled = total === 0;
      // Мысли с листков идут отдельным потоком: они не ответ «я приду» и не
      // должны ни подменять его, ни попадать в подсчёт напитков.
      var answers = all.filter(function (a) { return !isIdea(a); });
      var ideasKey = ideasByGuest(all.filter(isIdea));
      var byKey = latestByGuest(answers);
      var count = Object.keys(byKey).length;
      document.getElementById('sub').textContent = count
        ? 'Ответили: ' + count + ' из ' + Math.max(count, GUESTS.length)
        : 'Пока никто не ответил.';
      renderGuests(byKey, ideasKey);
      renderSummary(byKey);
      status.textContent = 'обновлено в ' + now();
    })
    .catch(function (e) {
      status.className = 'status error';
      status.textContent = 'не получилось загрузить: ' + e.message;
      document.getElementById('sub').textContent = 'Ответы лежат на сервере — проверь, что сервис отвечает.';
      clearBtn.disabled = true; // не предлагаем стирать то, чего не видели
    });
}

// Очистка уносит ответы в архив на сервере, так что нажатие сгоряча не смертельно.
// Но спрашиваем всё равно: страница открыта, а кнопка стоит рядом с «Обновить».
function clearAll() {
  if (clearBtn.disabled) return;
  var what = total + ' ' + plural(total, 'ответ', 'ответа', 'ответов');
  if (!confirm('Удалить ' + what + '? Страница станет пустой.')) return;
  clearBtn.disabled = true;
  status.className = 'status';
  status.textContent = 'очищаю…';
  fetch('/api/answers', { method: 'DELETE', cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (data) {
      var n = (data && data.cleared) || 0;
      return load().then(function () {
        // Если перечитать не вышло, оставляем на виду ошибку загрузки — она важнее.
        if (status.className.indexOf('error') !== -1) return;
        status.textContent = 'очищено в ' + now() + ' — ' + n + ' ' +
          plural(n, 'ответ', 'ответа', 'ответов');
      });
    })
    .catch(function (e) {
      status.className = 'status error';
      status.textContent = 'не получилось очистить: ' + e.message;
      clearBtn.disabled = total === 0;
    });
}

document.getElementById('refresh').addEventListener('click', load);
clearBtn.addEventListener('click', clearAll);
// Возвращаешься на вкладку — видишь свежие ответы, без ручного обновления.
document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
load();
</script>
</body>
</html>
